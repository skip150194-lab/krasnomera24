name: Sync Telegram Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    paths:
      - ".github/workflows/sync-telegram.yml"
      - "scripts/sync_telegram.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Telegram post through Bot API and rebuild catalog
        run: python scripts/sync_telegram.py

      - name: Commit catalog update
        run: |
          if git diff --quiet -- public/numbers.json data/telegram-sync-state.json; then
            echo "Catalog has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/numbers.json data/telegram-sync-state.json
          git commit -m "Hourly catalog sync from Telegram Bot API"
          git push
