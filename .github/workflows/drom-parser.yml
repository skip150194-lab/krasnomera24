name: Drom parser smoke run

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      pages:
        description: Number of Drom result pages
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous progress
        run: |
          cp data/drom-scan/checked_ads.json tools/drom-parser/checked_ads.json 2>/dev/null || true
          cp data/drom-scan/beautiful_numbers.csv tools/drom-parser/beautiful_numbers.csv 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/drom-parser/requirements.txt

      - name: Install parser
        run: |
          python -m pip install -r tools/drom-parser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run parser
        env:
          CI: 'true'
          INPUT_PAGES: "${{ inputs.pages }}"
        run: |
          PAGES="${INPUT_PAGES:-5}"
          python tools/drom-parser/drom_parser.py --pages "$PAGES" --full

      - name: Save results to repository
        if: always()
        run: |
          mkdir -p data/drom-scan
          cp tools/drom-parser/beautiful_numbers.csv data/drom-scan/ 2>/dev/null || true
          cp tools/drom-parser/checked_ads.json data/drom-scan/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/drom-scan
          if git diff --cached --quiet; then
            echo 'No result changes'
            exit 0
          fi
          git commit -m 'Update Drom parser results'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload CSV and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drom-beautiful-numbers
          path: |
            tools/drom-parser/beautiful_numbers.csv
            tools/drom-parser/checked_ads.json
          if-no-files-found: warn
          retention-days: 7
